server:
  port: 9001

spring:
  application:
    name: watch-alert
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    database: 0
    
  # 邮件配置
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:33306/watchalert?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

# AWS配置
aws:
  region: ap-northeast-1
  access-key-id: your-access-key
  secret-access-key: your-secret-key

# 阿里云配置
aliyun:
  access-key-id: your-access-key
  access-key-secret: your-secret-key
  region: cn-hangzhou

# Elasticsearch配置
elasticsearch:
  host: localhost
  port: 9200
  scheme: http

# JWT配置
jwt:
  secret: your-jwt-secret-key
  expiration: 86400000  # 24小时

# 告警配置
alert:
  check-interval: 300  # 5分钟
  notification:
    email:
      enabled: true
    dingtalk:
      enabled: false
      webhook: your-dingtalk-webhook 